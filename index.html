<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comprehensive English Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>Comprehensive English Test</h1>
      <p>Grammar & Vocabulary Online Exam</p>
    </header>

    <section class="student-card">
      <label>Student Name
        <input type="text" id="studentName" placeholder="Write your name here" />
      </label>
      <label>Class
        <input type="text" id="studentClass" placeholder="Class" />
      </label>
    </section>

    <form id="examForm">
      <section>
        <h2>Part A: Grammar</h2>
        <p class="instructions">Choose the correct answer from the words in parentheses.</p>
        <div id="grammarQuestions"></div>
      </section>

      <section>
        <h2>Part B: Vocabulary</h2>
        <p class="instructions">Use the word bank to complete each sentence.</p>
        <div class="word-bank" id="wordBank"></div>
        <div id="vocabularyQuestions"></div>
      </section>

      <button type="button" id="finishBtn">Finish Exam & Show Grade</button>
    </form>

    <section id="resultBox" class="result-box hidden"></section>
    <section id="answerKeyBox" class="answer-key hidden"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
