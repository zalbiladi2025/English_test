<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Grammar and Vocabulary Exam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>English Grammar and Vocabulary Exam</h1>
      <p>Choose the correct answer. After finishing, the grade and correct answers will appear.</p>
    </section>

    <section class="student-box">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" placeholder="Write your name here">
    </section>

    <form id="examForm"></form>

    <div class="actions">
      <button id="submitBtn" type="button">Finish Exam</button>
      <button id="resetBtn" type="button" class="secondary">Reset</button>
    </div>

    <section id="result" class="result hidden"></section>
    <section id="answerKey" class="answer-key hidden"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
